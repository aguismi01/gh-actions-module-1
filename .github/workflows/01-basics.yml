name: Practice 01 Bascis of GH-01

on:
  push:
    branches:
      - practice
    paths:
      - "docs/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Display Hello
        run: echo "Hello from GitHub Actions"

      - name: Display current time
        run: uptime