name: 03-Manual

on:
  push:
    
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - dev
          - staging


jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: display event name and ref
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo Event name : ${{ github.event_name }}
          echo Ref : "$GITHUB_REF"

      - name: Run only on push
        if: ${{ github.ref == 'push' }}
        run: echo "this is a push event"

      - name: display event inputs only on manual workflow
        if: ${{ github.ref == 'workflow_dispatch' }}
        run: echo ${{ github.event.inputs.environment }} 